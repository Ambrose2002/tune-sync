[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tune-sync"
version = "0.1.0"
description = "Transfer playlists between music streaming services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.2",
    "spotipy==2.26.0",
]

[project.scripts]
tune-sync = "tune_sync.app:main"

[tool.setuptools.packages.find]
where = ["src"]
